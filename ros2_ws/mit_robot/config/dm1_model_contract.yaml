model: DM1
contract_version: 1
joint_order: [FR_hip, FR_thigh, FR_calf, FL_hip, FL_thigh, FL_calf, RR_hip, RR_thigh, RR_calf, RL_hip, RL_thigh, RL_calf]
leg_order: [FR, FL, RR, RL]
joint_order_per_leg: [hip, thigh, calf]
# 2026-11-02：电机零位 = OpenDog 机械零位（髋水平、大腿电机接口对准螺丝、小腿伸直顶限位），
# q = 电机角 = OpenDog URDF 关节角；旧坐标 q_old = q + [0, 0.203, 2.22]。
# 趴卧（启动/趴下保持）姿态：
prone_home_position_rad: [0, -0.203, -2.22, 0, -0.203, -2.22, 0, -0.203, -2.22, 0, -0.203, -2.22]
kinematic_joint_offset_rad: [0, 0, 0]
# 每腿 [hip, thigh, calf]，按 leg_order 重复四次；与 dm1.hpp 和 MJCF joint range 同步。
joint_lower_limit_rad: [-1.57, -1.57, -2.25, -1.57, -1.57, -2.25, -1.57, -1.57, -2.25, -1.57, -1.57, -2.25]
joint_upper_limit_rad: [1.57, 2.4, 0.0, 1.57, 2.4, 0.0, 1.57, 2.4, 0.0, 1.57, 2.4, 0.0]
# 0.28 m 站姿：侧视连杆中心线对水平倾角约 27.85 度；这不是电机转角相等。
stand_joint_position_front_rad: [0, -0.485961, -1.480271]
stand_joint_position_rear_rad: [0, -0.485961, -1.480271]
nominal_body_height_m: 0.28
# 按用户要求恢复 f3c1696 父提交的整机模型 14.705035 kg；实测整机仍为 11.8 kg。
body_mass_kg: 6.889103
# 2026-11-02：base 质心 x/y 改为 (-0.026751, 0.008577)，按站立实测压力中心修正一半；质量不变。
motor:
  name: DM-J6248P-2EC
  continuous_torque_nm: 30
  peak_torque_nm: 97
  rated_speed_rpm: 40
  no_load_speed_rpm: 60
  feedback_timeout_s: 0.05
control:
  minimum_standing_height_m: 0.28
  maximum_standing_height_m: 0.42
  # 站立速度参数：硬件版和 MuJoCo 共用。
  # 换站立速度要修改的地方：抬升速率（m/s）。
  standing_height_rate_mps: 0.04
  # MIT 趴地展开时长，对应现有 C++ stand_up_duration；OpenDog 独立配置为 3.2 s。
  stand_up_duration_s: 2.4
  # 仅放慢大腿（HFE）展开速度；髋关节和小腿保持 stand_up_duration_s 的速度。
  stand_up_thigh_speed_scale: 0.75
  physics_timestep_s: 0.002
  modes: [passive, joint_pd, balance_stand, locomotion, stand_up, recovery_stand, walk_classic, prone_down]
mjcf:
  file: src/dm1_description/dm1/dm1.xml
  sha256: 57e4259ad6e33593e9201d4c0d8b2a01de920c3a3696577db1b3e9ce59fd0062
  fixed_installation_rotations_baked_in: true
